<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request received</title>
  <style>
    body { font: 18px/1.5 ui-sans-serif, system-ui, sans-serif; max-width: 36rem; margin: 12vh auto; padding: 0 1.25rem; color: #111; }
    .muted { color: #64748b; }
  </style>
</head>
<body>
  <h1>Thanks — we logged your interest.</h1>
  <p class="muted">This is an evaluation landing page. No account was created and no payment was taken.</p>
  <p id="v" class="muted"></p>
  <script>
    const v = new URLSearchParams(location.search).get("v") || "unknown";
    document.getElementById("v").textContent = "Variant: " + v;
  </script>
</body>
</html>
